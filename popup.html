<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickRead AI</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            width: 420px;
            height: 560px;
            margin: 0;
            padding: 14px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            color: #202124;
        }

        .main-shell {
            height: 100%;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .title {
            font-size: 16px;
            font-weight: 650;
            color: #1f1f1f;
        }

        .close-btn {
            background: transparent;
            border: 0;
            border-radius: 6px;
            font-size: 20px;
            cursor: pointer;
            color: #5f6368;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            background: #f1f3f4;
        }

        .page-context {
            border: 1px solid #e0e3e7;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 12px;
            background: #fafafa;
        }

        .page-title {
            font-size: 13px;
            font-weight: 600;
            line-height: 1.35;
            color: #202124;
            max-height: 36px;
            overflow: hidden;
        }

        .page-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            margin-top: 8px;
            color: #5f6368;
            font-size: 11px;
        }

        .source-pill,
        .cache-note {
            display: inline-flex;
            align-items: center;
            min-height: 20px;
            border-radius: 999px;
            padding: 2px 8px;
            font-weight: 600;
            background: #e8f0fe;
            color: #185abc;
        }

        .cache-note {
            background: #e6f4ea;
            color: #137333;
        }

        .mode-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 12px;
            padding: 3px;
            border: 1px solid #e0e3e7;
            border-radius: 8px;
            background: #f8fafd;
        }

        .mode-btn {
            min-width: 0;
            padding: 8px 6px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: #5f6368;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
        }

        .mode-btn.active {
            background: #ffffff;
            color: #1a73e8;
            box-shadow: 0 1px 2px rgba(60, 64, 67, 0.2);
        }

        .mode-btn:hover:not(.active) {
            background: #eef3fb;
        }

        .summary-container {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 2px 8px 2px 0;
        }

        .summary-content {
            line-height: 1.55;
            font-size: 13px;
            color: #202124;
            overflow-wrap: anywhere;
        }

        .summary-content h2,
        .summary-content h3 {
            margin: 12px 0 6px;
            font-size: 13px;
            line-height: 1.35;
            color: #202124;
        }

        .summary-content h2:first-child,
        .summary-content h3:first-child {
            margin-top: 0;
        }

        .summary-content p {
            margin: 0 0 8px;
        }

        .summary-content ul,
        .summary-content ol {
            margin: 0 0 10px;
            padding-left: 20px;
        }

        .summary-content li {
            margin-bottom: 5px;
        }

        .summary-content blockquote {
            margin: 8px 0;
            padding-left: 10px;
            border-left: 3px solid #dadce0;
            color: #5f6368;
        }

        .summary-content code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12px;
            background: #f1f3f4;
            border-radius: 4px;
            padding: 1px 4px;
        }

        .summary-content pre {
            overflow-x: auto;
            margin: 8px 0;
            padding: 10px;
            border-radius: 6px;
            background: #f1f3f4;
        }

        .summary-content pre code {
            padding: 0;
            background: transparent;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #5f6368;
            font-size: 13px;
        }

        .spinner {
            width: 22px;
            height: 22px;
            border: 2px solid #e8eaed;
            border-top: 2px solid #1a73e8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            color: #b3261e;
            padding: 12px;
            background: #fce8e6;
            border: 1px solid #f5c2bd;
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.45;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .action-btn {
            min-width: 0;
            padding: 8px 10px;
            border: 1px solid #dadce0;
            border-radius: 7px;
            background: #ffffff;
            color: #1a73e8;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .action-btn:hover {
            background: #f8fafd;
            border-color: #c5c9ce;
        }

        .settings-btn {
            color: #5f6368;
        }

        .hidden {
            display: none !important;
        }

        .onboarding {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px;
        }

        .onboarding h2 {
            font-size: 18px;
            font-weight: 650;
            margin: 0 0 14px;
            color: #202124;
        }

        .onboarding p {
            font-size: 13px;
            color: #5f6368;
            line-height: 1.55;
            margin: 0 0 14px;
        }

        .setup-btn {
            margin-top: 8px;
            background: #1a73e8;
            color: #ffffff;
            border: 0;
            border-radius: 7px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .setup-btn:hover {
            background: #1557b0;
        }
    </style>
</head>
<body>
    <div id="main-view" class="main-shell hidden">
        <div class="header">
            <div class="title">QuickRead AI</div>
            <button class="close-btn" id="close-btn" aria-label="关闭">×</button>
        </div>

        <div id="page-context" class="page-context hidden">
            <div id="page-title" class="page-title"></div>
            <div class="page-meta">
                <span id="source-pill" class="source-pill">网页正文</span>
                <span id="page-stats"></span>
                <span id="cache-note" class="cache-note hidden">已缓存</span>
            </div>
        </div>

        <div class="mode-selector" role="tablist" aria-label="摘要模式">
            <button class="mode-btn active" data-mode="quick" role="tab">速览</button>
            <button class="mode-btn" data-mode="learn" role="tab">学习</button>
            <button class="mode-btn" data-mode="decide" role="tab">决策</button>
        </div>

        <div class="summary-container" id="summary-container">
            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <div>正在生成摘要...</div>
            </div>

            <div id="error" class="error hidden"></div>
            <div id="summary" class="summary-content" aria-live="polite"></div>
        </div>

        <div class="action-buttons">
            <button class="action-btn" id="copy-btn">复制</button>
            <button class="action-btn" id="regenerate-btn">重生成</button>
            <button class="action-btn settings-btn" id="settings-btn">设置</button>
        </div>
    </div>

    <div id="onboarding-view" class="onboarding">
        <h2>欢迎使用 QuickRead AI</h2>
        <p>根据你的阅读目的，快速生成网页摘要、学习框架或决策要点。</p>
        <p>API Key 保存在本机，网页内容只会发送给你选择的模型服务。</p>
        <button class="setup-btn" id="setup-btn">立即配置</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
