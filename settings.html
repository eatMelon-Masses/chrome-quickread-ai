<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickRead AI - 设置</title>
    <style>
        body {
            width: 500px;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            color: #333333;
        }
        
        .header {
            margin-bottom: 24px;
        }
        
        .title {
            font-size: 20px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 4px;
        }
        
        .subtitle {
            font-size: 14px;
            color: #666666;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #333333;
        }
        
        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d0d0d0;
            border-radius: 6px;
            font-size: 14px;
            background: white;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #1a73e8;
            box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2);
        }
        
        .password-input {
            font-family: monospace;
        }
        
        .help-text {
            font-size: 12px;
            color: #666666;
            margin-top: 6px;
            line-height: 1.4;
        }
        
        .provider-link {
            color: #1a73e8;
            text-decoration: none;
        }
        
        .provider-link:hover {
            text-decoration: underline;
        }
        
        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }
        
        .btn {
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .btn-primary {
            background: #1a73e8;
            color: white;
            border: none;
        }
        
        .btn-primary:hover {
            background: #1557b0;
        }
        
        .btn-secondary {
            background: #f8f8f8;
            color: #333333;
            border: 1px solid #d0d0d0;
        }
        
        .btn-secondary:hover {
            background: #e8e8e8;
        }
        
        .status-message {
            padding: 12px;
            border-radius: 6px;
            margin-top: 16px;
            font-size: 13px;
            display: none;
        }
        
        .status-success {
            background: #e6f4ea;
            color: #137333;
            border: 1px solid #81c995;
        }
        
        .status-error {
            background: #ffebee;
            color: #d93025;
            border: 1px solid #f28b82;
        }
        
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #1a73e8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .test-result {
            margin-top: 16px;
            padding: 12px;
            background: #f8f8f8;
            border: 1px solid #d0d0d0;
            border-radius: 6px;
            max-height: 200px;
            overflow-y: auto;
        }

        .test-result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .test-result pre {
            margin: 0;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-word;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">QuickRead AI — 设置</div>
        <div class="subtitle">配置你的 LLM API Key</div>
    </div>
    
    <form id="settings-form">
        <div class="form-group">
            <label class="form-label" for="provider">LLM 提供商</label>
            <select id="provider" class="form-control">
                <option value="openai">OpenAI</option>
                <option value="qwen">通义千问</option>
                <option value="deepseek">DeepSeek</option>
                <option value="custom">自定义</option>
            </select>
            <div class="help-text">
                支持 OpenAI 兼容格式的提供商。选择“自定义”可输入完整 API URL。
            </div>
        </div>
        
        <div class="form-group">
            <label class="form-label" for="apiKey">API Key</label>
            <input type="password" id="apiKey" class="form-control password-input" placeholder="sk-··················">
            <div class="help-text">
                🔗 没有 Key？前往 
                <a href="#" class="provider-link" id="get-key-link">获取 API Key</a>
            </div>
        </div>
        
        <div class="form-group" id="baseUrl-group" style="display: none;">
            <label class="form-label" for="baseUrl">API 基础 URL</label>
            <input type="text" id="baseUrl" class="form-control" placeholder="https://api.openai.com/v1">
            <div class="help-text">
                自定义提供商时请输入完整的 API 基础 URL（包含 /v1 等路径）。
            </div>
        </div>
        
        <div class="form-group">
            <label class="form-label" for="model">模型名称</label>
            <input type="text" id="model" class="form-control" placeholder="gpt-4o-mini">
            <div class="help-text">
                输入完整的模型名称，如 gpt-4o-mini、qwen-plus、claude-3-haiku 等。
            </div>
        </div>
    </form>
    
    <div id="status-message" class="status-message"></div>

    <div class="action-buttons">
        <button type="button" class="btn btn-secondary" id="clear-btn">清除 Key</button>
        <button type="button" class="btn btn-secondary" id="test-btn">🧪 测试连接</button>
        <button type="button" class="btn btn-primary" id="save-btn">保存</button>
    </div>

    <div id="test-result" class="test-result" style="display: none;">
        <div class="test-result-header">
            <strong>测试响应：</strong>
            <span id="test-result-close" style="cursor: pointer; float: right;">×</span>
        </div>
        <pre id="test-result-content"></pre>
    </div>

    <script src="settings.js"></script>
</body>
</html>
